[project]
name = "saasforge-backend"
version = "0.1.0"
description = "SaaSForge Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic[email]>=2.7.4",
    "pydantic-settings>=2.3.4",
    "redis>=5.0.7",
    "celery>=5.4.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "bandit>=1.7.9",
    "types-redis>=4.6.0.20240425",
    "types-passlib>=1.7.7.20240327",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "env",
    ".venv",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "B", "UP", "N"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic", ".venv", "venv", "env"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests", "alembic", "venv", "env", ".venv"]

[tool.setuptools.packages.find]
include = ["app*"]
